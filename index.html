  html, body {
    margin: 0;
    height: 100%;
    background: #d4eed5;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;

  /* 390 x 844 피그마 프레임 비율을 유지하며 화면에 맞춤 */
  .stage {
    position: relative;
    width: min(100vw, calc(100dvh * 390 / 844));
    aspect-ratio: 390 / 844;
    container-type: inline-size;
  }
  .stage > svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: visible;
  }
  .caption {
    position: absolute;
    left: 50%;
    top: calc(605.79 / 844 * 100%);
    transform: translateX(-50%);
    margin: 0;
    font-family: 'LeeSeoyun', 'Apple SD Gothic Neo', sans-serif;
    font-size: calc(24 / 390 * 100cqw);
    line-height: normal;
    color: #05431c;
    white-space: nowrap;
    pointer-events: none;
  }

  /* 잎사귀 버튼: 진한 초록 테두리는 고정, 연두색만 눌림 */
  .leaf {
    cursor: pointer;
    outline: none;
    touch-action: none;
  }
  .leaf .inner {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 240ms cubic-bezier(.34, 1.56, .64, 1), filter 240ms ease-out;
  }
  .leaf.pressed .inner {
    transform: translateY(1.5px) scale(0.9);
    filter: brightness(0.88);
    transition: transform 60ms ease-out, filter 60ms ease-out;
  }
  .leaf:focus-visible .outline path {
    stroke: #ffffff;
    stroke-width: 3;
  }
  .bubble { pointer-events: none; }
  .stem { pointer-events: none; }

  /* iOS 햅틱용 숨겨진 스위치 */
  .haptic-hidden {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
    left: 0;
    top: 0;
  }

  };
  const VOLUME = { press: 0.9, release: 0.9 };
  let audio = null;
  const buffers = {};
  function b64ToArrayBuffer(dataUri) {
    const bin = atob(dataUri.split(',')[1]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }
  function getAudio() {
    if (!audio) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audio = new AC();
      for (const key of Object.keys(SOUND_SRC)) {
        audio.decodeAudioData(b64ToArrayBuffer(SOUND_SRC[key]),
          (buf) => { buffers[key] = buf; }, () => {});
      }
    }
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    return audio;
  }
  function clickSound(key) {
    const ac = getAudio();
    if (!ac || !buffers[key]) return;
    const src = ac.createBufferSource();
    const g = ac.createGain();
    src.buffer = buffers[key];
    src.playbackRate.value = 0.97 + Math.random() * 0.06; // 매번 똑같지 않게 아주 살짝 변화
    g.gain.value = VOLUME[key];
    src.connect(g).connect(ac.destination);
    src.start();
  }
  // 페이지가 열리면 소리를 미리 해독해 두기 (첫 클릭부터 바로 소리가 나도록)
  try { getAudio(); } catch (e) {}

  // ── 말풍선: 아래에서 살짝 올라오며 희미해짐 ──
  const bubbleTemplate = document.getElementById('bubble-template');
  const bubbleLayer = document.getElementById('bubble-layer');
  function spawnBubble() {
    const b = bubbleTemplate.cloneNode(true);
    b.removeAttribute('id');
    b.setAttribute('class', 'bubble');
    const dx = (Math.random() * 2 - 1) * 6; // 연타 시 겹치지 않게 살짝 흔들기
    bubbleLayer.appendChild(b);
    const anim = b.animate([
      { transform: `translate(${dx}px, 14px)`, opacity: 0 },
      { transform: `translate(${dx}px, 0px)`, opacity: 1, offset: 0.18 },
      { transform: `translate(${dx}px, -26px)`, opacity: 0 }
    ], { duration: 1400, easing: 'cubic-bezier(.22, .61, .36, 1)', fill: 'forwards' });
    anim.onfinish = () => b.remove();
  }

  document.querySelectorAll('.leaf').forEach((leaf) => {
    let activePointer = null;

    const press = () => {
      leaf.classList.add('pressed');
      haptic(PRESS_MS);
      clickSound('press');
      spawnBubble();
    };
    const release = (withHaptic) => {
      if (!leaf.classList.contains('pressed')) return;
      leaf.classList.remove('pressed');
      if (withHaptic) {
        haptic(RELEASE_MS);
        clickSound('release');
      }
    };

    leaf.addEventListener('pointerdown', (e) => {
      if (activePointer !== null) return;
      e.preventDefault();
      activePointer = e.pointerId;
      try { leaf.setPointerCapture(e.pointerId); } catch (_) {}
      press();
    });
    leaf.addEventListener('pointerup', (e) => {
      if (e.pointerId !== activePointer) return;
      activePointer = null;
      release(true);
    });
    leaf.addEventListener('pointercancel', (e) => {
      if (e.pointerId !== activePointer) return;
      activePointer = null;
      release(false);
    });

    // 키보드 (Space / Enter)
    leaf.addEventListener('keydown', (e) => {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(); }
    });
    leaf.addEventListener('keyup', (e) => {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); release(true); }
    });
    leaf.addEventListener('blur', () => release(false));
  });

  // 더블탭 확대·길게 누르기 메뉴 방지
  document.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
})();
